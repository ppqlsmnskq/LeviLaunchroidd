name: Android CI - Auto Build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Prepare google-services.json
        run: |
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {
            "project_info": { "project_number": "000000000000", "project_id": "ci-placeholder", "storage_bucket": "ci-placeholder.appspot.com" },
            "client": [ { "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000", "android_client_info": { "package_name": "org.levimc.launcher" } }, "oauth_client": [], "api_key": [ { "current_key": "AIzaSyCIOnlyPlaceholderKey" } ], "services": { "appinvite_service": { "other_platform_oauth_client": [] } } } ],
            "configuration_version": "1"
          }
          JSON
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant Execute Permission
        run: chmod +x ./gradlew

      - name: Determine Version
        run: |
          VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//' || true)
          if [ -z "$VERSION" ]; then
            VERSION="1.5.16"
          fi
          echo "BUILD_VERSION=$VERSION" >> $GITHUB_ENV
      - name: Build Release APK
        run: ./gradlew assembleRelease -PversionName="${{ env.BUILD_VERSION }}" -PversionCode=1514
        env:
          VERSION_NAME: ${{ env.BUILD_VERSION }}

      - name: Prepare APK Output
        run: |
          mkdir -p output_apk
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            cp "$APK_FILE" "output_apk/levilauncher-${{ env.BUILD_VERSION }}-release.apk"
          else
            exit 1
          fi
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "levilauncher-${{ env.BUILD_VERSION }}-release"
          path: output_apk/*.apk

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: "v${{ env.BUILD_VERSION }}"
          name: "LeviLauncher v${{ env.BUILD_VERSION }}"
          files: output_apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
